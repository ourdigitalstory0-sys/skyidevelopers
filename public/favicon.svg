<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- Dark Luxury Container with Brand Glow -->
  <rect width="512" height="512" rx="128" fill="#070b1f" />
  <rect x="8" y="8" width="496" height="496" rx="120" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="8" />

  <!-- Official SKYi Star Mark Emblem (Accurately Cropped) -->
  <g id="skyi-star-mark">
    <!-- Top Dot -->
    <circle cx="256" cy="112" r="22" fill="#FF5C2B" />

    <!-- Vertical Stem -->
    <rect x="238" y="152" width="36" height="224" rx="6" fill="#FF5C2B" />

    <!-- Horizontal Bar -->
    <rect x="144" y="246" width="224" height="36" rx="6" fill="#FF5C2B" />

    <!-- Diagonal Bar (45 deg) -->
    <rect x="166" y="246" width="180" height="36" rx="6" fill="#FF5C2B" transform="rotate(45 256 264)" />

    <!-- Diagonal Bar (-45 deg) -->
    <rect x="166" y="246" width="180" height="36" rx="6" fill="#FF5C2B" transform="rotate(-45 256 264)" />
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d132b" />
      <stop offset="100%" stop-color="#070b1f" />
    </linearGradient>
    <linearGradient id="border-grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF5C2B" />
      <stop offset="50%" stop-color="#ab47bc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>
</svg>